<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oops! Page Not Found</title>
<style>
    body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #0e0f12;
        color: #e0e0e0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        padding: 20px;
    }

    h1 {
        font-size: 4.5rem;
        margin: 0;
        color: #ff4757;
    }

    .sub {
        font-size: 1.6rem;
        margin-top: 10px;
        color: #f1f2f6;
    }

    .work {
        margin-top: 20px;
        font-size: 1rem;
        max-width: 450px;
        line-height: 1.5;
        color: #a4b0be;
    }

    a {
        margin-top: 30px;
        display: inline-block;
        color: #1e90ff;
        text-decoration: none;
        border: 1px solid #1e90ff;
        padding: 10px 22px;
        border-radius: 6px;
        transition: 0.25s;
    }

    a:hover {
        background: #1e90ff;
        color: #0e0f12;
    }

    .emoji {
        font-size: 3rem;
        margin-bottom: 10px;
        opacity: 0.9;
    }
</style>
</head>
<body>
    <div class="emoji">🔧</div>
    <h1>404</h1>
    <div class="sub">Page Not Found</div>
    <p class="work">
        Looks like you’ve wandered into an unfinished part of the site.<br>
        I’m still working on building everything here, so check back soon!
    </p>
    <a href="/">Return to Home</a>
</body>
</html>
